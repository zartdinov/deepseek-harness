# DeepSeek Harness Web UI. Image version is 0.1.0-rc.6.
#
# Both volume mounts are required. Set DSH_WORKSPACE to an absolute host path:
#   DSH_WORKSPACE=/absolute/path/to/project docker compose up --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dsh-web:0.1.0-rc.6
    ports:
      - '3080:3080'
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - type: bind
        source: "${DSH_WORKSPACE:?set DSH_WORKSPACE to the absolute host path of the project directory}"
        target: /workspace
      - type: volume
        source: dsh-home
        target: /home/node/.dsh
    init: true

volumes:
  dsh-home:
